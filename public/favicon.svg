<!--
  Reduced version of the Logo.astro mark.

  The full lockup fades across five cells. At 16px the faintest two disappear
  into the background and the mark reads as noise, so this keeps three cells:
  one solid and two ghosts stepping down, in the same honeycomb geometry so the
  two still read as one family. Composition is centred on the 48x48 viewBox so
  it does not drift left when a browser crops to a square.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <g fill="none" stroke="#43943a" stroke-width="2.6" stroke-linejoin="round">
    <path d="M33 21.4 L42 26.6 L42 37 L33 42.2 L24 37 L24 26.6 Z" opacity="0.42"/>
    <path d="M15 21.4 L24 26.6 L24 37 L15 42.2 L6 37 L6 26.6 Z" opacity="0.7"/>
  </g>
  <path d="M24 5.8 L33 11 L33 21.4 L24 26.6 L15 21.4 L15 11 Z" fill="#43943a"/>
</svg>
