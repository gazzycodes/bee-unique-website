<!--
  Reduced version of the Logo.astro mark. The full lockup fades across five
  cells; at 16px the faintest two disappear into the background and the mark
  reads as noise, so this keeps the solid cell plus two ghosts and drops the
  rest. Same geometry, so the two still read as one family.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="54" height="54">
  <g fill="none" stroke="#43943a" stroke-width="2.4" stroke-linejoin="round">
    <path d="M14 28 L24.4 34 L24.4 46 L14 52 L3.6 46 L3.6 34 Z" opacity="0.7"/>
    <path d="M27 15 L37.4 21 L37.4 33 L27 39 L16.6 33 L16.6 21 Z" opacity="0.42"/>
  </g>
  <path d="M14 2 L24.4 8 L24.4 20 L14 26 L3.6 20 L3.6 8 Z" fill="#43943a"/>
</svg>
